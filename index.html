<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>US Market & RM 통합 대시보드 | 한솔섬유</title>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap');
:root { --bg: #F8FAFC; --bg2: #FFFFFF; --border: #E2E8F0; --txt: #0F172A; --txt2: #64748B; --blue: #2563EB; --blue-d: #1E3A8A; }
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--txt); margin: 0; }
.topbar { background: var(--blue-d); color: #fff; padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; }
.logo { font-size: 1.2rem; font-weight: 700; }
.page-tabs { display: flex; background: #fff; border-bottom: 2px solid var(--border); padding: 0 24px; }
.page-tab { padding: 14px 24px; font-size: 15px; font-weight: 600; color: var(--txt2); cursor: pointer; border-bottom: 4px solid transparent; transition: all 0.2s; }
.page-tab:hover { background-color: #F1F5F9; }
.page-tab.active { color: var(--blue-d); border-bottom-color: var(--blue); }
.main { padding: 28px; max-width: 1400px; margin: 0 auto; }
.page { display: none; }
.page.active { display: block; }
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: 9px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 20px; border-top: 3px solid var(--blue); }
h3.ctitle { font-size: 16px; font-weight: 700; margin: 0 0 15px 0; border-left: 4px solid var(--blue); padding-left: 10px; }
.loader { color: var(--blue); font-weight: 600; padding: 20px; }
.metric { font-size: 32px; font-weight: 800; color: var(--txt); }
.metric-sub { font-size: 14px; font-weight: 600; }
.pos { color: #059669; } .neg { color: #DC2626; }
select { padding: 8px 12px; font-size: 15px; border-radius: 6px; border: 1px solid var(--border); font-family: inherit; }
.news-item { padding: 10px 0; border-bottom: 1px solid var(--border); }
.news-item a { color: var(--blue); text-decoration: none; font-weight: 500; }
.news-item a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">📊 한솔섬유 US Market & RM 통합 대시보드</div>
  <div style="font-size: 12px; color: #60A5FA;">🟢 Vercel 무중단 24H 가동 중</div>
</div>

<div class="page-tabs">
  <div class="page-tab active" onclick="showTab('tab1', this)">📈 FRED 소매 판매</div>
  <div class="page-tab" onclick="showTab('tab2', this)">🚢 OTEXA 수입 데이터</div>
  <div class="page-tab" onclick="showTab('tab3', this)">🏢 기업 모니터링</div>
  <div class="page-tab" onclick="showTab('tab4', this)">🌐 거시경제 및 원가</div>
</div>

<div class="main">
  <!-- TAB 1 -->
  <div id="tab1" class="page active">
    <div class="card">
        <h3 class="ctitle">미국 소매 카테고리 별 성장률 (YTD)</h3>
        <div id="fred-chart1" class="loader">데이터 수집 중... (약 5초 소요)</div>
    </div>
  </div>

  <!-- TAB 2 -->
  <div id="tab2" class="page">
    <div class="card">
        <h3 class="ctitle">미국 의류 수입 국가별 비중 (%)</h3>
        <div id="otexa-msg" class="loader">데이터 불러오는 중...</div>
        <div id="otexa-chart"></div>
    </div>
  </div>

  <!-- TAB 3 -->
  <div id="tab3" class="page">
    <div style="margin-bottom: 20px;">
        <select id="companySelect" onchange="loadCompany()">
            <option value="WMT|Walmart">Walmart (월마트)</option>
            <option value="TGT|Target">Target (타겟)</option>
            <option value="VSCO|Victoria's Secret">Victoria's Secret (빅토리아 시크릿)</option>
            <option value="ANF|Abercrombie">Abercrombie & Fitch (아베크롬비)</option>
        </select>
    </div>
    <div class="card">
        <h3 class="ctitle">실시간 주가</h3>
        <div id="comp-price" class="loader">로딩 중...</div>
        <div id="comp-chart"></div>
    </div>
    <div class="card">
        <h3 class="ctitle">관련 최신 뉴스</h3>
        <div id="comp-news" class="loader">로딩 중...</div>
    </div>
  </div>

  <!-- TAB 4 -->
  <div id="tab4" class="page">
    <div class="card">
        <h3 class="ctitle">원/달러 환율 (최근 1년)</h3>
        <div id="macro-krw" class="loader">로딩 중...</div>
    </div>
  </div>
</div>

<script>
// 탭 전환 기능
function showTab(tabId, el) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.page-tab').forEach(t => t.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    el.classList.add('active');
    
    // 탭 누를 때 최초 로딩
    if(tabId === 'tab1' && !window.fredLoaded) { window.fredLoaded=true; loadFred(); }
    if(tabId === 'tab2' && !window.otexaLoaded) { window.otexaLoaded=true; loadOtexa(); }
    if(tabId === 'tab3' && !window.compLoaded) { window.compLoaded=true; loadCompany(); }
    if(tabId === 'tab4' && !window.macroLoaded) { window.macroLoaded=true; loadMacro(); }
}

// [Tab 1] FRED
function loadFred() {
    fetch('/api/fred').then(r=>r.json()).then(data => {
        if(data.error) { document.getElementById('fred-chart1').innerHTML = data.error; return; }
        document.getElementById('fred-chart1').innerHTML = "";
        
        let cats = Object.keys(data.ytd);
        let vals = Object.values(data.ytd);
        
        Plotly.newPlot('fred-chart1', [{
            type: 'bar', x: vals, y: cats, orientation: 'h',
            marker: {color: vals.map(v => v < 0 ? '#DC2626' : '#2563EB')},
            text: vals.map(v => v.toFixed(1) + '%'), textposition: 'outside'
        }], { height: 500, margin: {l: 250}, xaxis: {gridcolor: '#E2E8F0'} });
    });
}

// [Tab 2] OTEXA
function loadOtexa() {
    fetch('/api/otexa').then(r=>r.json()).then(data => {
        if(data.error) { document.getElementById('otexa-msg').innerHTML = "<span class='neg'>" + data.error + " (깃허브에 CSV 파일이 있는지 확인하세요!)</span>"; return; }
        document.getElementById('otexa-msg').style.display = "none";
        
        let traces = data.years.map((year, i) => {
            return {
                x: data.share.map(d => d.Country),
                y: data.share.map(d => d[year]),
                name: year, type: 'bar'
            };
        });
        Plotly.newPlot('otexa-chart', traces, { barmode: 'group', height: 400 });
    });
}

// [Tab 3] 기업 모니터링
function loadCompany() {
    document.getElementById('comp-price').innerHTML = "로딩 중...";
    document.getElementById('comp-news').innerHTML = "로딩 중...";
    let val = document.getElementById('companySelect').value.split('|');
    
    fetch(`/api/company?ticker=${val[0]}&keyword=${val[1]}`).then(r=>r.json()).then(data => {
        let pColor = data.mom >= 0 ? 'pos' : 'neg';
        let pSign = data.mom >= 0 ? '+' : '';
        document.getElementById('comp-price').innerHTML = `
            <div class="metric">$ ${data.price.toFixed(2)}</div>
            <div class="metric-sub ${pColor}">${pSign}${data.mom.toFixed(2)}% (MoM)</div>
        `;
        
        let dates = data.history.map(d => d.date);
        let closes = data.history.map(d => d.close);
        Plotly.newPlot('comp-chart', [{ x: dates, y: closes, type: 'scatter', line: {color: '#2563EB'} }], {height: 300, margin:{t:10}});
        
        let newsHtml = data.news.map(n => `<div class="news-item"><a href="${n.link}" target="_blank">📰 ${n.title}</a></div>`).join('');
        document.getElementById('comp-news').innerHTML = newsHtml || "최신 뉴스가 없습니다.";
    });
}

// [Tab 4] 거시경제
function loadMacro() {
    fetch('/api/macro').then(r=>r.json()).then(data => {
        if(data.krw) {
            document.getElementById('macro-krw').innerHTML = "";
            let dates = data.krw.history.map(d => d.d);
            let vals = data.krw.history.map(d => d.v);
            Plotly.newPlot('macro-krw', [{ x: dates, y: vals, type: 'scatter', line: {color: '#D97706'} }], {height: 300, margin:{t:10}});
        } else {
            document.getElementById('macro-krw').innerHTML = "야후 파이낸스에서 일시적으로 거부됨";
        }
    });
}

// 시작할 때 1번 탭 실행
loadFred();
</script>
</body>
</html>
